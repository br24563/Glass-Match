name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # Most users run GlassMatch on Windows (start.bat).
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

  smoke:
    name: App import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify app imports and database loads
        run: |
          python -c "import ast, pathlib; ast.parse(pathlib.Path('app.py').read_text(encoding='utf-8')); print('app.py parses')"
          python -c "from glassmatch.database import load_default_database as l; db=l(); print('glasses:', len(db.glasses))"
          python -c "from streamlit.testing.v1 import AppTest; at=AppTest.from_file('app.py', default_timeout=300).run(); print('exceptions:', len(at.exception)); [print(e.value) for e in at.exception]; raise SystemExit(1 if at.exception else 0)"

      - name: Enforce data policy (no manufacturer catalogs committed)
        run: |
          offenders=$(git ls-files '*.agf' '*.AGF' | grep -v '^tests/fixtures/' || true)
          if [ -n "$offenders" ]; then
            echo "Manufacturer catalogs are redistribution-limited and must not be committed:"
            echo "$offenders"
            exit 1
          fi
          echo "no manufacturer catalogs tracked (fixtures only)"
          offenders=$(git ls-files '*.xlsx' '*.XLSX' '*.xls' '*.XLS' || true)
          if [ -n "$offenders" ]; then
            echo "Manufacturer data workbooks must not be committed:"
            echo "$offenders"
            exit 1
          fi
          echo "no manufacturer workbooks tracked"

      - name: Data manifest matches the data
        run: python scripts/build_data_manifest.py --check

  package:
    name: Wheel installs and runs outside the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Install into a clean environment and run the CLI elsewhere
        run: |
          python -m venv /tmp/gm
          /tmp/gm/bin/pip install dist/*.whl
          cd /tmp
          /tmp/gm/bin/glassmatch version
          /tmp/gm/bin/glassmatch check
          /tmp/gm/bin/glassmatch n N-BK7 587.5618
          /tmp/gm/bin/glassmatch search --nd 1.5:1.55 --vd 60:70 --preferred --top 5
