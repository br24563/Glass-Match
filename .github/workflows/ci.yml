name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

  smoke:
    name: App import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify app imports and database loads
        run: |
          python -c "import ast, pathlib; ast.parse(pathlib.Path('app.py').read_text(encoding='utf-8')); print('app.py parses')"
          python -c "from glassmatch.database import load_default_database as l; db=l(); print('glasses:', len(db.glasses))"
          python -c "from streamlit.testing.v1 import AppTest; at=AppTest.from_file('app.py', default_timeout=300).run(); print('exceptions:', len(at.exception))"

      - name: Enforce data policy (no manufacturer catalogs committed)
        run: |
          offenders=$(git ls-files '*.agf' '*.AGF' | grep -v '^tests/fixtures/' || true)
          if [ -n "$offenders" ]; then
            echo "Manufacturer catalogs are redistribution-limited and must not be committed:"
            echo "$offenders"
            exit 1
          fi
          echo "no manufacturer catalogs tracked (fixtures only)"