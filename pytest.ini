[pytest]
# rootdir is pinned here (rather than inferred), and the repository root is put
# on sys.path explicitly. Without this, `import glassmatch` only worked when the
# invocation directory happened to be the repo root: on Linux CI the `pytest`
# console script left it off sys.path and all 12 test modules failed collection
# with exit code 2, while the same command passed on Windows.
pythonpath = .
testpaths = tests
